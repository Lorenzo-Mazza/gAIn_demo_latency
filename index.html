<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#edf6f0">
    <meta name="description" content="Surgical AI on compact edge hardware. Compare the FP32 and gAIn models in action and explore their measured latency.">
    <title>gAIn · Surgical AI on the edge</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="preload" href="assets/fonts/gAInSans-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="assets/fonts/gAInSans-Bold.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="styles.css?v=2">
    <script type="module" src="app.js?v=2"></script>
  </head>
  <body>
    <main class="demo-shell">
      <header class="masthead">
        <img class="brand" src="assets/gain-logo.png" alt="gAIn · Next Generation AI Computing" width="254" height="56">
        <div class="intro">
          <h1>Surgical AI, running locally.</h1>
          <p>Tissue grasping &amp; retraction <span aria-hidden="true">/</span> Raspberry Pi</p>
        </div>
        <div class="transport" role="group" aria-label="Video controls">
          <button class="icon-button" id="play-pause" type="button" title="Pause videos (Space)" aria-label="Pause videos" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path class="pause-symbol" d="M8 5v14M16 5v14"/><path class="play-symbol" d="m8 5 11 7-11 7Z"/></svg>
          </button>
          <button class="icon-button" id="restart" type="button" title="Replay both videos (R)" aria-label="Replay both videos">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10a8 8 0 1 1 .7 7M4 4v6h6"/></svg>
          </button>
          <button class="icon-button" id="fullscreen" type="button" title="Full screen (F)" aria-label="Enter full screen">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5"/></svg>
          </button>
        </div>
      </header>

      <section class="video-stage" aria-label="FP32 and gAIn task recordings">
        <figure class="video-card standard-card">
          <figcaption>
            <div class="model-name">FP32 <span>Standard AI</span></div>
            <span class="model-chip">Floating point</span>
          </figcaption>
          <div class="video-frame">
            <video id="fp32-video" muted playsinline preload="auto" poster="assets/fp32-poster.jpg?v=3" aria-label="FP32 model performing tissue grasping and retraction">
              <source src="assets/videos/fp32.mp4?v=3" type="video/mp4">
            </video>
            <ol class="phase-overlay" aria-label="FP32 task progress" data-model="fp32">
              <li data-phase="reach"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="6"/><path d="m7.5 12 3 3 6-6"/></svg><span>Reach</span></li>
              <li data-phase="grasp"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="6"/><path d="m7.5 12 3 3 6-6"/></svg><span>Grasp</span></li>
              <li data-phase="stretch"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="6"/><path d="m7.5 12 3 3 6-6"/></svg><span>Stretch</span></li>
            </ol>
          </div>
        </figure>
        <figure class="video-card gain-card">
          <figcaption>
            <div class="model-name">gAIn <span>Optimized AI</span></div>
            <span class="model-chip">INT8 / INT4</span>
          </figcaption>
          <div class="video-frame">
            <video id="gain-video" muted playsinline preload="auto" poster="assets/gain-poster.jpg?v=4" aria-label="gAIn model performing tissue grasping and retraction">
              <source src="assets/videos/gain.mp4?v=4" type="video/mp4">
            </video>
            <div id="gain-completion" class="completion-overlay" role="img" aria-label="gAIn task complete" hidden>
              <span class="completion-badge"><svg viewBox="0 0 96 96" aria-hidden="true"><path d="m24 49 16 16 33-34"/></svg></span>
            </div>
            <ol class="phase-overlay" aria-label="gAIn task progress" data-model="gain">
              <li data-phase="reach"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="6"/><path d="m7.5 12 3 3 6-6"/></svg><span>Reach</span></li>
              <li data-phase="grasp"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="6"/><path d="m7.5 12 3 3 6-6"/></svg><span>Grasp</span></li>
              <li data-phase="stretch"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="6"/><path d="m7.5 12 3 3 6-6"/></svg><span>Stretch</span></li>
            </ol>
          </div>
        </figure>
      </section>

      <section class="latency-panel" aria-labelledby="latency-heading">
        <div class="chart-toolbar">
          <div class="chart-title">
            <h2 id="latency-heading">Latency per prediction</h2>
            <div class="speedup"><strong id="speedup">3.1×</strong><span>faster</span></div>
          </div>
          <div class="chart-tools">
            <div class="legend" aria-label="Mean latency">
              <span class="legend-standard"><i aria-hidden="true"></i>FP32 <strong id="fp32-mean">776 ms</strong></span>
              <span class="legend-gain"><i aria-hidden="true"></i>gAIn <strong id="gain-mean">250 ms</strong></span>
            </div>
            <div class="metric-switch" role="group" aria-label="Latency measurement">
              <button type="button" data-metric="inference" aria-pressed="true">AI computation</button>
              <button type="button" data-metric="total" aria-pressed="false">Complete cycle</button>
            </div>
          </div>
        </div>
        <div class="chart-container">
          <svg id="latency-chart" role="img" tabindex="0" aria-label="FP32 and gAIn latency per prediction. Use left and right arrows to inspect predictions."></svg>
          <div id="chart-tooltip" class="chart-tooltip" hidden></div>
        </div>
        <p class="sr-only" id="chart-announcement" aria-live="polite"></p>
      </section>
      <button class="start-overlay" id="start-demo" type="button" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7Z"/></svg>
        Play demo
      </button>
      <p class="error-message" id="error-message" role="alert" hidden></p>
    </main>
  </body>
</html>
